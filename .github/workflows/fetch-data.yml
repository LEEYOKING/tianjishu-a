name: 每日抓 A 股 + 盘前数据

on:
  # v2.0.7k:加 10:30 cron(早盘 1 小时稳定),9:35 可能集合竞价数据不稳
  schedule:
    - cron: '35 1 * * 1-5'   # UTC 01:35 = 北京 09:35(集合竞价刚开,数据可能不稳)
    - cron: '30 2 * * 1-5'   # UTC 02:30 = 北京 10:30(早盘稳定,主用)
    - cron: '30 5 * * 1-5'   # UTC 05:30 = 北京 13:30(午后开盘稳定)
    - cron: '30 6 * * 1-5'   # UTC 06:30 = 北京 14:30(午后尾盘)
    - cron: '35 7 * * 1-5'   # UTC 07:35 = 北京 15:35(收盘后)
    - cron: '5 10 * * 1-5'   # UTC 10:05 = 北京 18:05(A 股龙虎榜 18:00 完整披露后 5 min)
    - cron: '10 10 * * 1-5'  # UTC 10:10 = 北京 18:10(补一次,防 18:05 akshare 接口未稳定)
  # 允许手动触发
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install akshare
        run: pip install akshare --break-system-packages

      - name: 跑 fetch_real_data.py(A 股)
        id: fetch
        run: |
          if python scripts/fetch_real_data.py; then
            echo "fetch_real_data.py OK"
            echo "fetch_status=ok" >> $GITHUB_OUTPUT
          else
            echo "fetch_real_data.py 失败 — 降级写 data.json(从 git HEAD 复制 + _fetchError 标记)"
            # v2.0.7cv: 降级逻辑搬到独立脚本(避免 GitHub Actions yaml 解析 python << 'PYEOF' heredoc)
            if python scripts/_fetch_fallback.py; then
              echo "fetch_status=degraded" >> $GITHUB_OUTPUT
            else
              echo "fetch_status=failed" >> $GITHUB_OUTPUT
            fi
          fi
        continue-on-error: true

      - name: 跑 fetch_surgery_data.py(盘前 + 手术)
        run: python scripts/fetch_surgery_data.py
        continue-on-error: true

      - name: 提交新数据
        if: steps.fetch.outputs.fetch_status != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          # v2.0.7cx: push 前先 pull rebase(避免远端有 commit 没 pull 冲突)
          # 之前 16:05 push de6daaf + 16:04 #50 跑完 push — 冲突 'Updates were rejected'
          git pull --rebase origin main || (git rebase --abort && echo "pull rebase 失败,继续 push")
          git add public/data.json public/prescan.json public/surgery.json
          if git diff --cached --quiet; then
            echo "无新数据,跳过提交"
          else
            STATUS="${{ steps.fetch.outputs.fetch_status }}"
            git commit -m "data: 每日抓数 $(date -u +%F) [$STATUS]"
            git push
          fi
