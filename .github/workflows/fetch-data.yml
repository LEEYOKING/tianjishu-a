name: 每日抓 A 股 + 盘前数据

on:
  # v2.0.7k:加 10:30 cron(早盘 1 小时稳定),9:35 可能集合竞价数据不稳
  # v2.0.7dj:加 10:00 cron(早盘 em/akshare 限流恢复)+ 保留 10:30 兜底
  schedule:
    - cron: '35 1 * * 1-5'   # UTC 01:35 = 北京 09:35(集合竞价刚开,em/akshare 限流严)
    - cron: '0 2 * * 1-5'    # UTC 02:00 = 北京 10:00(早盘限流大概率恢复,主用)
    - cron: '30 2 * * 1-5'   # UTC 02:30 = 北京 10:30(兜底:10:00 cron 失败时再跑一次)
    - cron: '20 5 * * 1-5'   # UTC 05:20 = 北京 13:20(午后开盘 15 分钟,user v2.0.7dn 改)— 13:05 限流严时改 13:20
    - cron: '0 6 * * 1-5'    # UTC 06:00 = 北京 14:00(午后盘中,user v2.0.7dn 改 14:30→14:00)— 拉早盘 + 午后 1 小时数据
    - cron: '35 7 * * 1-5'   # UTC 07:35 = 北京 15:35(收盘后)
    - cron: '5 10 * * 1-5'   # UTC 10:05 = 北京 18:05(A 股龙虎榜 18:00 完整披露后 5 min)
    - cron: '10 10 * * 1-5'  # UTC 10:10 = 北京 18:10(补一次,防 18:05 akshare 接口未稳定)
  # 允许手动触发
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install akshare
        run: pip install akshare --break-system-packages

      - name: 跑 fetch_real_data.py(A 股)
        id: fetch
        run: |
          if python scripts/fetch_real_data.py; then
            echo "fetch_real_data.py OK"
            echo "fetch_status=ok" >> $GITHUB_OUTPUT
          else
            echo "fetch_real_data.py 失败 — 降级写 data.json(从 git HEAD 复制 + _fetchError 标记)"
            # v2.0.7cv: 降级逻辑搬到独立脚本(避免 GitHub Actions yaml 解析 python << 'PYEOF' heredoc)
            if python scripts/_fetch_fallback.py; then
              echo "fetch_status=degraded" >> $GITHUB_OUTPUT
            else
              echo "fetch_status=failed" >> $GITHUB_OUTPUT
            fi
          fi
        continue-on-error: true

      - name: 跑 fetch_surgery_data.py(盘前 + 手术)
        run: python scripts/fetch_surgery_data.py
        continue-on-error: true

      - name: 提交新数据
        if: steps.fetch.outputs.fetch_status != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          # v2.0.7cz:fetch_real_data.py 跑后 public/data.json 有 uncommitted 改动
          # 直接 git pull --rebase 失败 'You have unstaged changes'
          # 修法:先 git stash 暂存 → pull rebase → stash pop 恢复
          git stash push -m "fetch-data-yml-temp-stash" public/data.json public/prescan.json public/surgery.json || true
          # 拉远端更新(如果远端有 commit 没 pull)
          git pull --rebase origin main || (git rebase --abort && echo "pull rebase 失败,继续")
          # 恢复 stash(fetch_real_data 写的 data.json)
          git stash pop || (echo "stash pop 失败 — 可能远端 data.json 冲突" && git checkout --theirs public/data.json && git add public/data.json)
          # 暂存 + pull + pop 完毕 — 重新 add
          git add public/data.json public/prescan.json public/surgery.json
          if git diff --cached --quiet; then
            echo "无新数据,跳过提交"
          else
            STATUS="${{ steps.fetch.outputs.fetch_status }}"
            git commit -m "data: 每日抓数 $(date -u +%F) [$STATUS]"
            # v2.0.7ff:加 push 失败重试 3 次(防止 GH Actions runner 网络抖动)— 失败时 issue 告警
            for i in 1 2 3; do
              if git push; then
                echo "push 成功 (attempt $i)"
                break
              else
                echo "push 失败 (attempt $i/3) — 等待 30s 重试"
                sleep 30
              fi
            done
            if ! git status --porcelain=vcs 1>/dev/null 2>&1; then
              echo "::warning::git push 最终失败 — 需要手动检查"
            fi
          fi
