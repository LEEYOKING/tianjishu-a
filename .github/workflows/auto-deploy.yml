# v2.0.7cb: GitHub Actions 部署到 Cloudflare Pages
# v2.0.7cs:只 deploy,不 fetch(fetch-data.yml 负责 fetch 7 次/天)
# 触发:推 main 时
# 需要 secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID

name: 部署到 Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:           # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Copy data files
        run: |
          cp public/data.json dist/data.json
          cp public/surgery.json dist/surgery.json
          cp public/prescan.json dist/prescan.json

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name=tianjishu-a \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
