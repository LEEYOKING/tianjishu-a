# v2.0.7br: GitHub Actions 自动部署到 Cloudflare Pages
# v2.0.7cv: 改用 wrangler CLI 部署(只需要 CLOUDFLARE_API_TOKEN,不需要 accountId)
# 触发:推 main 分支自动部署到 production
# 需要 secrets: CLOUDFLARE_API_TOKEN

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Copy data files
        run: |
          cp public/data.json dist/data.json
          cp public/surgery.json dist/surgery.json
          cp public/prescan.json dist/prescan.json

      - name: Deploy to Cloudflare Pages via wrangler
        run: |
          npx wrangler pages deploy dist \
            --project-name=tianjishu-a \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
